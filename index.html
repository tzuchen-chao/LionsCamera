<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>獅子會社會服務擺拍指導</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f9;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h2 { color: #003366; margin-top: 15px; margin-bottom: 5px; font-size: 22px; }
    #status { color: #666; font-size: 13px; margin-bottom: 10px; padding: 0 20px; }

    /* 相機主畫面區塊 */
    #camera-container {
      position: relative;
      width: 92vw;
      height: 92vw;
      max-width: 450px;
      max-height: 450px;
      border-radius: 12px;
      overflow: hidden;
      background-color: #000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #poseGuide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.85; /* 稍微加深一點讓虛線更清楚 */
    }

    /* 攝影師白話提示 */
    #poseHint {
      position: absolute;
      bottom: 15px;
      width: 100%;
      text-align: center;
      color: white;
      font-weight: bold;
      font-size: 15px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8), 0 0 10px rgba(0,0,0,0.5);
      pointer-events: none;
      padding: 0 15px;
      box-sizing: border-box;
      line-height: 1.4;
    }

    /* 主要拍照控制區 */
    #main-controls {
      width: 100%;
      max-width: 500px;
      padding: 15px 0 10px 0;
      display: flex;
      justify-content: center;
    }

    #snapBtn, #retakeBtn {
      padding: 12px 30px;
      font-size: 18px;
      font-weight: bold;
      background-color: #F2A900;
      color: #003366;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      width: 80%;
    }
    #snapBtn:active { transform: scale(0.98); }
    #retakeBtn { background-color: #ccc; display:none; }

    /* 10個情境按鈕的面板 */
    #pose-panel {
      width: 95vw;
      max-width: 500px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding: 0 10px 20px 10px;
      box-sizing: border-box;
    }

    .pose-btn {
      padding: 10px 4px;
      font-size: 14px;
      font-weight: bold;
      background-color: #ffffff;
      color: #003366;
      border: 2px solid #003366;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: normal;
      line-height: 1.2;
    }

    .pose-btn.active {
      background-color: #003366;
      color: #ffffff;
      border-color: #F2A900;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    #result-container { margin-top: 10px; display: none; text-align: center; width: 90vw; max-width: 450px; }
    #result-image { width: 100%; border: 2px solid #003366; border-radius: 10px; }
  </style>
</head>
<body>

  <h2>📸 公益紀錄擺拍相機</h2>
  <p id="status">請直接對齊畫面中的圖形與文字</p>

  <div id="camera-container">
    <video id="video" autoplay playsinline></video>
    <img id="poseGuide" alt="擺拍導引">
    <div id="poseHint"></div>
  </div>

  <div id="main-controls">
    <button id="snapBtn">📸 拍下這張照片</button>
    <button id="retakeBtn">🔄 重新拍攝</button>
  </div>

  <div id="pose-panel"></div>

  <canvas id="canvas" style="display:none;"></canvas>

  <div id="result-container">
    <h3>✅ 拍攝完成！<br><small style="color:#666; font-size:14px;">(請長按上方圖片儲存至相簿)</small></h3>
    <img id="result-image" alt="拍攝結果" />
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const snapBtn = document.getElementById('snapBtn');
    const retakeBtn = document.getElementById('retakeBtn');
    const posePanel = document.getElementById('pose-panel');
    const resultContainer = document.getElementById('result-container');
    const resultImage = document.getElementById('result-image');
    const cameraContainer = document.getElementById('camera-container');
    const poseGuide = document.getElementById('poseGuide');
    const poseHint = document.getElementById('poseHint');

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = stream;
        video.onloadedmetadata = function() { updatePose(0); };
      } catch (err) {
        alert("無法開啟相機，請確認瀏覽器權限！");
      }
    }

    startCamera();

    snapBtn.addEventListener('click', () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      resultImage.src = canvas.toDataURL('image/jpeg', 0.8);
      cameraContainer.style.display = 'none';
      snapBtn.style.display = 'none';
      posePanel.style.display = 'none';
      resultContainer.style.display = 'block';
      retakeBtn.style.display = 'inline-block';
    });

    retakeBtn.addEventListener('click', () => {
      cameraContainer.style.display = 'block';
      snapBtn.style.display = 'inline-block';
      posePanel.style.display = 'grid';
      resultContainer.style.display = 'none';
      retakeBtn.style.display = 'none';
    });

    // 產生具體的 SVG 圖形與文字
    function generateSvgGuide(poseType) {
      let content = '';
      const style = 'fill="none" stroke="#F2A900" stroke-width="2" stroke-dasharray="4,4" stroke-linecap="round"';
      const textStyle = 'font-family="sans-serif" font-size="6" fill="#F2A900" text-anchor="middle" font-weight="bold"';

      switch (poseType) {
        case 'blood':
          content = `
            <circle cx="25" cy="30" r="8" ${style}/> <path d="M25 38 L25 70 M25 45 L10 60 M25 45 L40 60 M25 70 L15 90 M25 70 L35 90" ${style}/>
            <text x="25" y="20" ${textStyle}>護理師站這裡</text>
            <circle cx="75" cy="50" r="8" ${style}/> <path d="M75 58 L75 80 M75 65 L60 75 M75 65 L90 75 M75 80 L65 95 M75 80 L85 95" ${style}/>
            <text x="75" y="40" ${textStyle}>獅友坐這裡</text>
            <path d="M40 60 L60 75" ${style}/> <text x="50" y="65" ${textStyle}>抽血動作</text>`;
          break;
        case 'vision':
          content = `
            <rect x="10" y="30" width="40" height="40" rx="5" ${style}/> <circle cx="30" cy="50" r="10" ${style}/>
            <text x="30" y="25" ${textStyle}>驗光儀器</text>
            <path d="M70 30 Q60 40 65 50 Q60 60 70 70 Q80 70 85 50 Q85 30 70 30" ${style}/>
            <text x="75" y="25" ${textStyle}>民眾側臉靠上</text>`;
          break;
        case 'meals':
          content = `
            <rect x="35" y="45" width="30" height="15" ${style}/> <text x="50" y="40" ${textStyle}>愛心便當/物資</text>
            <path d="M10 50 L35 50 M10 55 L35 55" ${style}/> <text x="20" y="65" ${textStyle}>遞交的手</text>
            <path d="M90 50 L65 50 M90 55 L65 55" ${style}/> <text x="80" y="65" ${textStyle}>接收的手</text>`;
          break;
        case 'kids-gift':
          content = `
            <circle cx="35" cy="50" r="8" ${style}/> <path d="M35 58 L35 85 M35 65 L20 75 M35 65 L50 75 M35 85 L25 95 M35 85 L45 95" ${style}/>
            <text x="35" y="40" ${textStyle}>獅友蹲下平視</text>
            <circle cx="70" cy="65" r="7" ${style}/> <path d="M70 72 L70 90 M70 75 L60 85 M70 75 L80 85" ${style}/>
            <text x="70" y="55" ${textStyle}>小朋友</text>
            <rect x="45" y="65" width="10" height="10" ${style}/>`;
          break;
        case 'diabetes':
          content = `
            <circle cx="50" cy="45" r="25" ${style}/>
            <text x="50" y="35" ${textStyle}>手部與檢測儀器特寫</text>
            <text x="50" y="50" ${textStyle}>(請將畫面放大)</text>`;
          break;
        case 'environment':
          content = `
            <rect x="10" y="10" width="80" height="20" ${style}/> <text x="50" y="22" ${textStyle}>活動紅布條對齊框框</text>
            <circle cx="20" cy="60" r="6" ${style}/> <path d="M20 66 L20 90 M20 70 L10 80 M20 70 L30 80" ${style}/>
            <circle cx="50" cy="60" r="6" ${style}/> <path d="M50 66 L50 90 M50 70 L40 80 M50 70 L60 80" ${style}/>
            <circle cx="80" cy="60" r="6" ${style}/> <path d="M80 66 L80 90 M80 70 L70 80 M80 70 L90 80" ${style}/>
            <text x="50" y="50" ${textStyle}>志工夥伴在下方排排站好</text>`;
          break;
        case 'ceremony':
          content = `
            <circle cx="50" cy="30" r="18" ${style}/> <text x="50" y="32" ${textStyle}>獅子會Logo</text>
            <path d="M10 85 Q20 75 30 85 M30 85 Q40 70 50 85 M50 85 Q60 70 70 85 M70 85 Q80 75 90 85" ${style}/>
            <text x="50" y="60" ${textStyle}>全體人員在下方集合</text>`;
          break;
        case 'flag':
          content = `
            <line x1="50" y1="10" x2="50" y2="90" ${style}/> <polygon points="50,15 75,25 50,35" fill="none" stroke="#F2A900" stroke-width="2"/>
            <text x="50" y="8" ${textStyle}>旗桿對齊這條線</text>
            <circle cx="25" cy="50" r="8" ${style}/> <path d="M25 58 L25 90" ${style}/> <text x="25" y="40" ${textStyle}>授旗會長</text>
            <circle cx="75" cy="50" r="8" ${style}/> <path d="M75 58 L75 90" ${style}/> <text x="75" y="40" ${textStyle}>接旗會長</text>`;
          break;
        case 'planting':
          content = `
            <path d="M30 70 Q40 50 50 70" ${style}/> <circle cx="30" cy="70" r="5" ${style}/>
            <text x="40" y="45" ${textStyle}>獅友彎腰動作</text>
            <path d="M50 85 L50 70 M45 75 L50 70 L55 75" ${style}/> <text x="65" y="80" ${textStyle}>小樹苗/工具</text>`;
          break;
        case 'guided-run':
          content = `
            <circle cx="35" cy="40" r="8" ${style}/> <path d="M35 48 L35 75 M35 55 L50 60 M35 75 L25 90 M35 75 L45 90" ${style}/>
            <text x="35" y="30" ${textStyle}>陪跑員</text>
            <circle cx="65" cy="40" r="8" ${style}/> <path d="M65 48 L65 75 M65 55 L50 60 M65 75 L55 90 M65 75 L75 90" ${style}/>
            <text x="65" y="30" ${textStyle}>視障朋友</text>
            <circle cx="50" cy="60" r="4" fill="#F2A900"/> <text x="50" y="70" ${textStyle}>牽引繩</text>`;
          break;
      }
      
      const svgString = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">${content}</svg>`;
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
    }

    const poses = [
      { id: 0, name: '💉 捐血活動', guideSrc: generateSvgGuide('blood'), hint: '「護理師請站旁邊，捐血的獅友坐中間，看鏡頭笑一個喔！」' },
      { id: 1, name: '🔍 視力篩檢', guideSrc: generateSvgGuide('vision'), hint: '「請將驗光儀器對準框框，民眾的側臉靠上去。」' },
      { id: 2, name: '🍱 愛心餐點', guideSrc: generateSvgGuide('meals'), hint: '「請將鏡頭靠近，拍下『雙手遞交便當』的溫馨特寫。」' },
      { id: 3, name: '🎁 癌童關懷', guideSrc: generateSvgGuide('kids-gift'), hint: '「獅友請稍微蹲下和小朋友平視，手拿禮物看這邊！」' },
      { id: 4, name: '🩸 血糖檢測', guideSrc: generateSvgGuide('diabetes'), hint: '「請把手機拿近一點，將手部抽血的動作放在中央。」' },
      { id: 5, name: '🧹 淨灘/服務', guideSrc: generateSvgGuide('environment'), hint: '「紅布條對齊上方框框，志工夥伴請在下方排好喔！」' },
      { id: 6, name: '🦁 授證大合照', guideSrc: generateSvgGuide('ceremony'), hint: '「請把獅子會Logo放在正上方，所有人往中間靠攏！」' },
      { id: 7, name: '🚩 授旗典禮', guideSrc: generateSvgGuide('flag'), hint: '「旗桿請對齊中間的線，兩位會長站左右兩側，看鏡頭！」' },
      { id: 8, name: '🌳 社區綠化', guideSrc: generateSvgGuide('planting'), hint: '「請獅友們做出彎腰種樹或打掃的動作，自然就好！」' },
      { id: 9, name: '🏃 陪跑導盲', guideSrc: generateSvgGuide('guided-run'), hint: '「請拍下兩人牽引繩的動作，捕捉一起跑步的瞬間。」' }
    ];

    poses.forEach((pose, index) => {
      const btn = document.createElement('button');
      btn.className = 'pose-btn';
      btn.innerText = pose.name;
      btn.addEventListener('click', () => updatePose(index));
      posePanel.appendChild(btn);
    });

    function updatePose(index) {
      poseGuide.src = poses[index].guideSrc;
      poseHint.innerText = poses[index].hint;
      const allBtns = document.querySelectorAll('.pose-btn');
      allBtns.forEach(b => b.classList.remove('active'));
      allBtns[index].classList.add('active');
    }
  </script>
</body>
</html>
