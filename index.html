<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>獅子會社會服務擺拍指導相機</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f9;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h2 { color: #003366; margin-top: 20px; margin-bottom: 5px; }
    #status { color: #666; font-size: 14px; margin-bottom: 15px; padding: 0 20px; }

    /* 相機主畫面區塊 */
    #camera-container {
      position: relative;
      width: 90vw;
      height: 90vw; /* 保持正方形 */
      max-width: 500px;
      max-height: 500px;
      border-radius: 15px;
      overflow: hidden;
      background-color: #000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #poseGuide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.8;
    }

    #poseHint {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      color: white;
      font-weight: bold;
      font-size: 16px;
      text-shadow: 2px 2px 4px black;
      pointer-events: none;
      padding: 0 20px;
      box-sizing: border-box;
    }

    /* 主要拍照控制區 */
    #main-controls {
      width: 100%;
      max-width: 500px;
      padding: 15px 0;
      display: flex;
      justify-content: center;
    }

    #snapBtn, #retakeBtn {
      padding: 15px 40px;
      font-size: 20px;
      font-weight: bold;
      background-color: #F2A900;
      color: #003366;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      width: 80%;
    }
    #snapBtn:active { transform: scale(0.98); }
    #retakeBtn { background-color: #ccc; display:none; }

    /* 10個情境按鈕的面板 */
    #pose-panel {
      width: 95vw;
      max-width: 600px;
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* 兩欄式排列，適合平板 */
      gap: 10px;
      padding: 0 10px 20px 10px;
      box-sizing: border-box;
    }

    .pose-btn {
      padding: 12px 5px;
      font-size: 14px;
      font-weight: bold;
      background-color: #ffffff;
      color: #003366;
      border: 2px solid #003366;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      /* 文字過長時允許換行 */
      white-space: normal;
      line-height: 1.2;
    }

    /* 被選中時的按鈕樣式 */
    .pose-btn.active {
      background-color: #003366;
      color: #ffffff;
      border-color: #F2A900;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    #result-container { margin-top: 15px; display: none; text-align: center; width: 90vw; max-width: 500px; }
    #result-image { width: 100%; border: 2px solid #003366; border-radius: 10px; }

  </style>
</head>
<body>

  <h2>公益紀錄擺拍指導</h2>
  <p id="status">點擊下方按鈕切換情境</p>

  <div id="camera-container">
    <video id="video" autoplay playsinline></video>
    <img id="poseGuide" alt="擺拍導引">
    <div id="poseHint"></div>
  </div>

  <div id="main-controls">
    <button id="snapBtn">📸 拍下紀錄照</button>
    <button id="retakeBtn">🔄 重新拍攝</button>
  </div>

  <div id="pose-panel"></div>

  <canvas id="canvas" style="display:none;"></canvas>

  <div id="result-container">
    <h3>✅ 拍攝完成！(長按圖片可儲存)</h3>
    <img id="result-image" alt="拍攝結果" />
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const snapBtn = document.getElementById('snapBtn');
    const retakeBtn = document.getElementById('retakeBtn');
    const posePanel = document.getElementById('pose-panel');
    const resultContainer = document.getElementById('result-container');
    const resultImage = document.getElementById('result-image');
    const cameraContainer = document.getElementById('camera-container');
    const poseGuide = document.getElementById('poseGuide');
    const poseHint = document.getElementById('poseHint');

    // 啟動相機
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        });
        video.srcObject = stream;
        video.onloadedmetadata = function() {
          updatePose(0); // 預設顯示第一組
        };
      } catch (err) {
        alert("無法開啟相機，請確認您已開啟瀏覽器的相機權限！");
      }
    }

    startCamera();

    // 拍照功能
    snapBtn.addEventListener('click', () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const dataURL = canvas.toDataURL('image/jpeg', 0.8);
      resultImage.src = dataURL;
      cameraContainer.style.display = 'none';
      snapBtn.style.display = 'none';
      posePanel.style.display = 'none';
      resultContainer.style.display = 'block';
      retakeBtn.style.display = 'inline-block';
    });

    // 重新拍攝
    retakeBtn.addEventListener('click', () => {
      cameraContainer.style.display = 'block';
      snapBtn.style.display = 'inline-block';
      posePanel.style.display = 'grid';
      resultContainer.style.display = 'none';
      retakeBtn.style.display = 'none';
    });

    // 產生 SVG 幾何剪影
    function generatePlaceholderSvg(poseType) {
      let svgContent = '';
      switch (poseType) {
        case 'blood': svgContent = '<circle cx="30" cy="40" r="15" fill="none" stroke="%23F2A900" stroke-width="2"/><rect x="20" y="60" width="20" height="40" fill="none" stroke="%23F2A900" stroke-width="2"/><circle cx="70" cy="30" r="15" fill="none" stroke="%23F2A900" stroke-width="2"/><rect x="60" y="50" width="20" height="50" fill="none" stroke="%23F2A900" stroke-width="2"/><circle cx="50" cy="55" r="5" fill="%23F2A900" />'; break;
        case 'vision': svgContent = '<circle cx="50" cy="50" r="30" fill="none" stroke="%23F2A900" stroke-width="2"/><ellipse cx="50" cy="50" rx="15" ry="25" fill="%23F2A900" transform="rotate(-15, 50, 50)" />'; break;
        case 'meals': svgContent = '<ellipse cx="30" cy="50" rx="20" ry="8" fill="%23F2A900"/><ellipse cx="70" cy="50" rx="20" ry="8" fill="%23F2A900"/><circle cx="50" cy="50" r="10" fill="none" stroke="%23F2A900" stroke-width="3"/>'; break;
        case 'kids-gift': svgContent = '<circle cx="30" cy="60" r="10" fill="none" stroke="%23F2A900" stroke-width="2"/><rect x="20" y="75" width="20" height="25" fill="none" stroke="%23F2A900" stroke-width="2"/><circle cx="70" cy="40" r="15" fill="none" stroke="%23F2A900" stroke-width="2"/><rect x="60" y="60" width="20" height="40" fill="none" stroke="%23F2A900" stroke-width="2"/><circle cx="50" cy="65" r="5" fill="%23F2A900"/>'; break;
        case 'diabetes': svgContent = '<circle cx="50" cy="30" r="15" fill="none" stroke="%23F2A900" stroke-width="2"/><rect x="35" y="50" width="30" height="50" fill="none" stroke="%23F2A900" stroke-width="2"/><circle cx="50" cy="80" r="5" fill="%23F2A900"/>'; break;
        case 'environment': svgContent = '<rect x="10" y="10" width="80" height="20" fill="none" stroke="%23F2A900" stroke-dasharray="5,5" stroke-width="2"/><circle cx="20" cy="70" r="8" fill="none" stroke="%23F2A900"/><circle cx="40" cy="70" r="8" fill="none" stroke="%23F2A900"/><circle cx="60" cy="70" r="8" fill="none" stroke="%23F2A900"/><circle cx="80" cy="70" r="8" fill="none" stroke="%23F2A900"/>'; break;
        case 'ceremony': svgContent = '<circle cx="50" cy="30" r="25" fill="none" stroke="%23F2A900" stroke-width="3"/><rect x="10" y="60" width="80" height="40" fill="%23F2A900" />'; break;
        case 'flag': svgContent = '<line x1="50" y1="10" x2="50" y2="90" stroke="%23F2A900" stroke-width="2"/><polygon points="50,10 80,25 50,40" fill="%23F2A900"/><ellipse cx="25" cy="50" rx="15" ry="30" fill="none" stroke="%23F2A900"/><ellipse cx="75" cy="50" rx="15" ry="30" fill="none" stroke="%23F2A900"/>'; break;
        case 'planting': svgContent = '<polygon points="10,60 30,50 30,70" fill="none" stroke="%23F2A900"/><polygon points="40,60 60,50 60,70" fill="none" stroke="%23F2A900"/><polygon points="70,60 90,50 90,70" fill="none" stroke="%23F2A900"/><circle cx="20" cy="85" r="5" fill="%23F2A900"/><circle cx="50" cy="85" r="5" fill="%23F2A900"/><circle cx="80" cy="85" r="5" fill="%23F2A900"/>'; break;
        case 'guided-run': svgContent = '<ellipse cx="35" cy="40" rx="10" ry="20" fill="none" stroke="%23F2A900"/><ellipse cx="65" cy="40" rx="10" ry="20" fill="none" stroke="%23F2A900"/><circle cx="50" cy="50" r="5" fill="%23F2A900"/>'; break;
      }
      return `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">${svgContent}</svg>`;
    }

    // 10組情境數據
    const poses = [
      { id: 0, name: '💉 捐血活動', guideSrc: generatePlaceholderSvg('blood'), hint: '護理師站立，獅友微笑坐姿' },
      { id: 1, name: '🔍 視力篩檢', guideSrc: generatePlaceholderSvg('vision'), hint: '圓孔對齊儀器，側臉對齊受檢者' },
      { id: 2, name: '🍱 愛心餐點', guideSrc: generatePlaceholderSvg('meals'), hint: '遞物與接物雙手交疊' },
      { id: 3, name: '🎁 癌童關懷', guideSrc: generatePlaceholderSvg('kids-gift'), hint: '獅友蹲下，小朋友站立' },
      { id: 4, name: '🩸 血糖檢測', guideSrc: generatePlaceholderSvg('diabetes'), hint: '手指對齊剪影，拍出專注感' },
      { id: 5, name: '🧹 淨灘服務', guideSrc: generatePlaceholderSvg('environment'), hint: '布條對齊上方，人物對齊下方' },
      { id: 6, name: '🦁 授證大合照', guideSrc: generatePlaceholderSvg('ceremony'), hint: 'Logo居中，全體對齊下方剪影' },
      { id: 7, name: '🚩 授旗典禮', guideSrc: generatePlaceholderSvg('flag'), hint: '旗桿居中，兩側人頭對齊' },
      { id: 8, name: '🌳 社區綠化', guideSrc: generatePlaceholderSvg('planting'), hint: '種樹動作對齊彎腰剪影' },
      { id: 9, name: '🏃 陪跑導盲', guideSrc: generatePlaceholderSvg('guided-run'), hint: '牽手處對齊黃圈' }
    ];

    // 動態生成 10 個按鈕到面板上
    poses.forEach((pose, index) => {
      const btn = document.createElement('button');
      btn.className = 'pose-btn';
      btn.innerText = pose.name;
      
      btn.addEventListener('click', () => {
        updatePose(index);
      });
      
      posePanel.appendChild(btn);
    });

    // 更新畫面與按鈕狀態
    function updatePose(index) {
      const pose = poses[index];
      poseGuide.src = pose.guideSrc;
      poseHint.innerText = pose.hint;
      
      // 更新按鈕的顏色 (移除所有 active，再加給當前點擊的按鈕)
      const allBtns = document.querySelectorAll('.pose-btn');
      allBtns.forEach(b => b.classList.remove('active'));
      allBtns[index].classList.add('active');
    }

  </script>

</body>
</html>
